    <title>Meus sites favoritos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .site-card {
            background: #fff;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .site-card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .site-card img {

            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 6px;
            display: block;
            margin: 10px 0;
            transition: transform 0.2s;
        }

        .site-card img:hover {
            transform: scale(1.08);
        }

        .site-card a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
            margin-top: 5px;
        }

        .site-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
